
name: Todo App CI

# When should workflow run?
on:
  push:
  pull_request:

jobs:
  build:
    name: Build and Lint
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Check code quality
      - name: Run ESLint
        run: npm run lint

      # Step 5: Build React application
      - name: Build project
        run: npm run build
